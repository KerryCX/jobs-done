version: 2
updates:
  # The app has no dependencies. These are only the test tools.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
